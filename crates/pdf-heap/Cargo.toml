[package]
name = "pdf-heap"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]

# Not `workspace = true`. The workspace table says `unsafe_code = "forbid"`,
# and `forbid` cannot be relaxed by an inner `allow` -- which is exactly why it
# says `forbid` and not `deny`. So this crate, and only this crate, declares
# its own table: the same lints at the same levels, with `unsafe_code` allowed.
# RFC 0014 decided it this way round so that the rule still holds everywhere
# else untouched, rather than being weakened for the whole workspace with an
# exception written somewhere a reader has to go and look for.
[lints.rust]
unsafe_code = "allow"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
