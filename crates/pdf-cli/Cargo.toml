[package]
name = "pdf-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
build = "build.rs"

[dependencies]
pdf-bytes = { path = "../pdf-bytes" }
pdf-content = { path = "../pdf-content" }
pdf-edit = { path = "../pdf-edit" }
pdf-paint = { path = "../pdf-paint" }
pdf-render = { path = "../pdf-render" }
pdf-semantics = { path = "../pdf-semantics" }
pdf-session = { path = "../pdf-session" }
pdf-syntax = { path = "../pdf-syntax" }

[lints]
workspace = true

# Cargo's default for an example is `test = false`, so a `#[cfg(test)]` module
# inside one compiles and never runs -- and `cargo test --workspace` reports it
# as zero tests without saying which. `place.rs` carried its known-answer
# controls that way for a whole slice. `AGENTS.md` requires an instrument to
# prove itself on a known answer, so every example that carries controls is
# declared here and runs in the gate.
[[example]]
name = "place"
test = true

[[example]]
name = "drawings"
test = true

[[example]]
name = "clips"
test = true

[[example]]
name = "profiles"
test = true

[[example]]
name = "membership"
test = true

[[example]]
name = "hits"
test = true
